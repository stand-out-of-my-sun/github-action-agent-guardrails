name: "Diogenes Agent & SQL Security Guardrails"
description: "Scans prompts, shell commands, and SQL migrations for injection vulnerabilities using Diogenes Free Developer Tier."
inputs:
  sql_query:
    description: "SQL migration or query string to audit"
    required: false
    default: ""
  command_text:
    description: "Shell command or agent prompt to verify"
    required: false
    default: ""
  session_key:
    description: "Optional Diogenes dg_sec_ prepaid key for unlimited CI/CD throughput"
    required: false
    default: ""
runs:
  using: "node20"
  main: "entrypoint.mjs"
